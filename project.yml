name: TurretEcsDemo
options:
  bundleIdPrefix: com.logdok
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # One local package holds every line of the app. AegisECS is NOT listed
  # here: it is Modules' own dependency, resolved transitively, so the shell's
  # dependency list stays exactly one entry long.
  Modules:
    path: Modules

targets:
  TurretEcsDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Only the shell. Adding a game file to this list would be the mistake
      # this layout exists to prevent — code goes in Modules/Sources/<module>/.
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: Modules
        product: GameRuntime
      - package: Modules
        product: GameUI
    info:
      path: App/Generated/Info.plist
      properties:
        CFBundleDisplayName: "Turret ECS Demo"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # Real Auto Layout, not the plain UILaunchScreen color+image pair:
        # the emblem centres itself via constraints instead of a fixed frame.
        UILaunchStoryboardName: LaunchScreen
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        # These four lines ARE the orientation lock, and the only thing that
        # is. A `UIApplicationDelegate.supportedInterfaceOrientationsFor`
        # override was tried and measured to be a no-op here: SwiftUI's
        # WindowGroup is scene-based, and that delegate method belongs to the
        # pre-scene lifecycle. With all orientations declared here the app
        # really did run portrait (`contentOrientation: portrait (1)` in the
        # SpringBoard log) despite the delegate returning `.landscape`.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: "TurretEcsDemo"
        PRODUCT_BUNDLE_IDENTIFIER: com.logdok.TurretEcsDemo
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
